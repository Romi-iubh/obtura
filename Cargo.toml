[workspace]
resolver = "2"
members = [
    "crates/obtura-capture",
    "crates/obtura-image",
    "crates/obtura-scene",
    "crates/obtura-render",
    "crates/obtura-core",
    "app",
]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "AGPL-3.0-or-later"
rust-version = "1.85"
authors = ["Rosaire"]
homepage = "https://github.com/Romi-iubh/obtura"
repository = "https://github.com/Romi-iubh/obtura"

[workspace.dependencies]
obtura-capture = { path = "crates/obtura-capture" }
obtura-image = { path = "crates/obtura-image" }
obtura-scene = { path = "crates/obtura-scene" }
obtura-render = { path = "crates/obtura-render" }
obtura-core = { path = "crates/obtura-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cairo = { package = "cairo-rs", version = "0.21" }
pangocairo = "0.21"
gtk = { package = "gtk4", version = "0.10", features = ["gnome_46"] }
adw = { package = "libadwaita", version = "0.8", features = ["v1_5"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

# The pixel work (joining a scrolling capture as it comes, blurring) is too slow unoptimised.
[profile.dev.package.obtura-image]
opt-level = 2
